<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arclight</title>
<style>
  :root {
    --wall:#ECE9F1; --panel:#F7F5FA; --panel-2:#FFFFFF; --line:#DAD5E3; --ink:#2B2735; --muted:#857F93;
    --accent:#D64A6E; --accent-ink:#FFFFFF; --stage:#191722; --bulb:#F5C542; --bad:#C8384F; --ok:#2E9E6B;
    --sans: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--wall); color:var(--ink); font:13px/1.45 var(--sans); }
  header { display:flex; gap:10px; align-items:center; padding:10px 16px; }
  header h1 { font-size:17px; font-weight:800; margin:0 8px 0 0; letter-spacing:-.01em; display:flex; align-items:center; gap:7px; }
  header h1 svg { width:18px; height:18px; }
  header input { width:auto; }
  #srv { width:190px; } #tok { width:120px; }
  .health { display:flex; gap:16px; margin-left:auto; color:var(--muted); font-size:12px; align-items:center; }
  .health b { color:var(--ink); font-weight:700; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  main { display:grid; grid-template-columns:1fr 330px; gap:14px; padding:0 16px 14px; height:calc(100vh - 54px); }
  #plan { min-width:0; min-height:0; display:flex; flex-direction:column; gap:8px; }
  #plan > .row { flex:none; }
  canvas { display:block; width:100%; flex:1; min-height:300px; border-radius:18px; background:var(--stage); cursor:crosshair; touch-action:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.04); }
  canvas.edit { cursor:move; }
  aside { background:var(--panel); border-radius:18px; padding:14px 16px; overflow-y:auto; min-height:0; }
  section { margin-bottom:18px; }
  section:last-child { margin-bottom:0; }
  h2 { font-size:13px; font-weight:700; margin:0 0 8px; color:var(--ink); display:flex; align-items:baseline; gap:8px; }
  h2 .hint { font-weight:500; }
  button { background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:4px 11px; cursor:pointer; font:inherit; font-weight:600; line-height:1.3; }
  button:hover { border-color:#BDB6CA; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  button.danger { color:var(--bad); border-color:#EBC3CB; }
  button.confirm { background:var(--bad); border-color:var(--bad); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  input[type=text], input[type=password], select { background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:4px 8px; font:inherit; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:4px 0; }
  .slider { display:grid; grid-template-columns:64px 1fr 42px 34px; gap:8px; align-items:center; margin:4px 0; }
  .slider label { color:var(--muted); }
  .slider input[type=range] { width:100%; accent-color:var(--accent); margin:0; }
  .slider .v { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); }
  .learn { font-size:10px; padding:1px 6px; color:var(--muted); font-weight:600; }
  .learn.armed { color:var(--accent); border-color:var(--accent); }
  .learn.bound { color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
  .pads { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .pads button { padding:10px 4px; border-radius:12px; }
  .pads button.full { border-color:var(--accent); color:var(--accent); }
  .areas { display:flex; flex-direction:column; gap:5px; }
  .area { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .area .name { background:none; border:none; padding:2px 4px 2px 0; color:var(--muted); font-weight:600; min-width:96px; text-align:left; }
  .area .name:hover { color:var(--ink); }
  .area .g { padding:1px 9px; font-size:12px; }
  .layers { font-size:12px; }
  .layers > div { display:flex; gap:6px; align-items:center; padding:4px 0; border-bottom:1px solid var(--line); }
  .layers .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
  .layers .muted .n { opacity:.45; text-decoration:line-through; }
  .layers button { padding:1px 8px; font-size:11px; }
  .hint { color:var(--muted); font-size:12px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:#A1660E; }
  .learn, .midi-only, .others, #relayRow, .edit-only { display:none; }
  body.midi-on .learn { display:inline-block; } body.midi-on .midi-only { display:block; }
  body.show-others .others { display:inline-block; } body.relays-selected #relayRow { display:flex; }
  body.editing .edit-only { display:inline; }
  details.fold summary { cursor:pointer; list-style:none; color:var(--muted); font-weight:600; }
  details.fold summary::-webkit-details-marker { display:none; }
  details.fold summary::before { content:"▸ "; } details.fold[open] summary::before { content:"▾ "; }
  @media (prefers-reduced-motion: no-preference) { button, .learn { transition:background-color .12s, border-color .12s, color .12s; } }
  @media (max-width: 900px) { main { grid-template-columns:1fr; height:auto; } #plan canvas { height:70vh; flex:none; } }
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5a6 6 0 0 0-3.6 10.8c.6.5.9 1.1 1 1.9h5.2c.1-.8.4-1.4 1-1.9A6 6 0 0 0 10 1.5Z" fill="#F5C542"/><rect x="7.2" y="15.2" width="5.6" height="1.6" rx=".8" fill="#2B2735"/><rect x="7.8" y="17.4" width="4.4" height="1.4" rx=".7" fill="#2B2735"/></svg>arclight</h1>
  <input id="srv" type="text" title="API server">
  <input id="tok" type="password" placeholder="token" title="API token: the Token field on debug.html">
  <button id="connect">Connect</button>
  <span id="status" class="hint">Not connected</span>
  <div class="health">
    <span><b id="hFps">–</b> fps</span>
    <span><b id="hLat">–</b> ms</span>
    <span><b id="hLayers">–</b> layers</span>
    <span>engine <b id="hEngine">none</b></span>
    <button id="saveAll" title="Save layout, presets and MIDI map into web/data (also happens automatically)">Save</button>
  </div>
</header>
<main>
  <div id="plan">
    <div class="row">
      <button id="selAll">All</button><button id="selNone">None</button><button id="selInv">Invert</button>
      <button id="sel4x1" class="others">4x1</button><button id="selRelays" class="others">Relays</button>
      <span class="hint" id="selInfo"></span>
      <span style="flex:1"></span>
      <span id="editTools" class="edit-only"><button id="alignY" title="Put the selected dots on one row">Align row</button><button id="alignX" title="Put the selected dots in one column">Align column</button><button id="spreadX" title="Space the selected dots evenly left to right">Spread across</button><button id="spreadY" title="Space the selected dots evenly top to bottom">Spread down</button><button id="tidy" title="Snap dots that are nearly on the same row or column onto it">Tidy</button><button id="layoutUndoBtn" title="Undo the last layout change">Undo</button></span>
      <button id="fitView" title="Fit the floor plan. Scroll pans, pinch or ctrl+scroll zooms.">Fit</button>
      <button id="showOthers" title="Also plot the 4x1s and relays">56–115</button>
      <button id="editLayout">Edit layout</button>
      <button id="layoutMore" title="Export or import the layout">⋯</button>
      <span id="layoutMenu" hidden><button id="exportLayout">Export</button><button id="importLayout">Import</button></span>
    </div>
    <canvas id="cv"></canvas>
    <div class="row" id="mapBar">
      <span class="hint" title="Lights one light at a time so you can see which dot is which">Identify</span>
      <button id="idStart">Start</button><button id="idPause" disabled>Pause</button><button id="idPrev" disabled title="← key">◀</button><button id="idNext" disabled title="→ key">▶</button><button id="idStop" class="danger" disabled>Stop</button>
      <input type="range" id="idSpeed" min="100" max="3000" step="50" style="width:110px;accent-color:var(--accent)" title="ms per light"><span id="idSpeedV" class="hint"></span>
      <span id="idNow" class="warn"></span>
      <span style="flex:1"></span>
      <span class="hint">Click selects, shift adds, drag draws a box.</span>
    </div>
  </div>
  <aside>
    <section>
      <h2>Groups <span class="hint">click to toggle</span></h2>
      <div class="areas" id="groupChips"></div>
    </section>
    <section>
      <div class="row">
        <button id="solo" title="Mute everyone else's layers so only yours show. Click again to unmute them.">Solo</button><button class="learn" data-learn="solo">midi</button>
        <button id="blackout" class="danger" title="Own the room and set every light to 0 (click twice)">Blackout</button><button class="learn" data-learn="blackout">midi</button>
        <button id="resetScene" class="danger" title="Delete every layer that isn't ours (click twice)">Reset scene</button>
      </div>
    </section>
    <section>
      <h2>Colour <span class="hint" id="colInfo"></span></h2>
      <div id="colour"></div>
      <div class="row" id="relayRow"><button id="relayOn">Relays on</button><button id="relayOff">Relays off</button></div>
    </section>
    <section>
      <h2>Look</h2>
      <div class="row"><select id="look"></select><select id="order" title="Direction of chase and wave, from the mapped positions"></select><button class="learn" data-learn="look">midi</button><button id="applyLook" title="Run the look on the selected lights">On selection</button><button id="lookAll">All bulbs</button></div>
      <div id="params"></div>
      <details class="fold"><summary>Timing</summary>
        <div class="slider"><label>fade</label><input type="range" id="fade" min="0" max="4000" step="50"><span class="v" id="fadeV"></span><button class="learn" data-learn="fade">midi</button></div>
        <div class="slider"><label>smooth</label><input type="range" id="tau" min="0" max="2000" step="10"><span class="v" id="tauV"></span><button class="learn" data-learn="tau">midi</button></div>
      </details>
      <div class="hint bad" id="engineInfo"></div>
    </section>
    <section>
      <h2>Presets <span class="hint">shift+click saves, alt+click clears</span></h2>
      <div class="pads" id="pads"></div>
    </section>
    <section>
      <h2>MIDI</h2>
      <div class="row"><button id="midiEnable">Enable</button><span class="hint" id="midiInfo"></span><button id="clearMidi" class="learn">clear map</button></div>
      <div class="hint midi-only">Click a <b>midi</b> button, then move a knob or hit a pad. Last: <span id="midiLast">–</span></div>
    </section>
    <section>
      <details class="fold"><summary>Layers <span id="layerCount"></span></summary><div class="layers" id="layers"></div></details>
    </section>
  </aside>
</main>
<input type="file" id="filePick" accept="application/json" hidden>
<script src="floorplan.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem("arclight." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("arclight." + k, JSON.stringify(v)); } catch (e) {} },
};
const COLOUR_CHANS = ["red", "green", "blue", "cold", "warm"];
const ENGINE_TAG = "// arclight-engine v1";

// ---------- looks: envelope functions that run on the Pi, and their knobs ----------
const LOOK_SRC = `
function hash(n) { var x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
var LOOKS = {
  none:    function () { return 1; },
  breathe: function (id, k, n, t, p) { return 1 - p.depth * (0.5 + 0.5 * Math.sin(2 * Math.PI * t / p.speed)); },
  chase:   function (id, k, n, t, p, u) { var pos = ((t % p.speed) / p.speed) * n; var d = Math.abs(k - pos); d = Math.min(d, n - d); return p.floor + (1 - p.floor) * Math.max(0, 1 - d / p.width); },
  wave:    function (id, k, n, t, p, u) { var ph = u - (t % p.speed) / p.speed; ph -= Math.floor(ph); return p.floor + (1 - p.floor) * Math.pow(Math.sin(ph * Math.PI), p.sharp); },
  sparkle: function (id, k, n, t, p) { var h = hash(id * 7.13 + Math.floor(t / p.rate) * 3.7); return h < p.density ? 1 : p.floor; },
  strobe:  function (id, k, n, t, p) { return Math.floor(t / p.period) % 2 === 0 ? 1 : 0; }
};`;
// name: [min, max, default, unit]
const LOOK_PARAMS = {
  none:    {},
  breathe: { speed: [500, 20000, 4000, "ms"], depth: [0, 1, 0.7, ""] },
  chase:   { speed: [300, 20000, 3000, "ms"], width: [0.5, 20, 2, "lights"], floor: [0, 1, 0.1, ""] },
  wave:    { speed: [500, 20000, 6000, "ms"], sharp: [1, 12, 4, ""], floor: [0, 1, 0.05, ""] },
  sparkle: { rate: [20, 2000, 150, "ms"], density: [0, 1, 0.3, ""], floor: [0, 1, 0.2, ""] },
  strobe:  { period: [30, 1000, 90, "ms"] },
};
function defaultParams(name) { const o = {}; for (const k in LOOK_PARAMS[name]) o[k] = LOOK_PARAMS[name][k][2]; return o; }
// spatial orders for chase / wave, computed from the mapped positions: ids sorted, plus u = 0..1 position along the order
const ORDERS = { "rows": "row by row", "→": "left → right", "←": "right → left", "↓": "top → bottom", "↑": "bottom → top", "↻": "around ↻", "↺": "around ↺", "path": "snake path", "id": "by id" };
function orderIds(ids, order) {
  const P = (id) => S.layout[id] || { x: 0.5, y: 0.5 }, u = {};
  if (!ids.length) return { ids: [], u };
  if (order === "id" || order === "rows") {
    const rank = {}; let k = 0; if (order === "rows") for (const g of S.map.groups) for (const id of g.ids) rank[id] = k++;
    const s = [...ids].sort((a, b) => ((rank[a] ?? 1e9) - (rank[b] ?? 1e9)) || (a - b));
    s.forEach((id, i) => { u[id] = s.length > 1 ? i / (s.length - 1) : 0; }); return { ids: s, u };
  }
  if (order === "path") {
    const rest = new Set(ids); let cur = [...ids].sort((a, b) => P(a).x - P(b).x)[0]; rest.delete(cur);
    const path = [cur], dist = { [cur]: 0 }; let total = 0;
    while (rest.size) { let best = null, bd = 1e9; for (const id of rest) { const d = Math.hypot(P(id).x - P(cur).x, P(id).y - P(cur).y); if (d < bd) { bd = d; best = id; } } rest.delete(best); total += bd; dist[best] = total; path.push(best); cur = best; }
    path.forEach((id) => { u[id] = total ? dist[id] / total : 0; }); return { ids: path, u };
  }
  let val;
  if (order === "↻" || order === "↺") {
    const cx = ids.reduce((a, id) => a + P(id).x, 0) / ids.length, cy = ids.reduce((a, id) => a + P(id).y, 0) / ids.length;
    val = (id) => { const a = (Math.atan2(P(id).y - cy, P(id).x - cx) + Math.PI) / (2 * Math.PI); return order === "↻" ? a : 1 - a; };
  } else { const th = { "→": 0, "↓": Math.PI / 2, "←": Math.PI, "↑": -Math.PI / 2 }[order] || 0; val = (id) => P(id).x * Math.cos(th) + P(id).y * Math.sin(th); }
  const vs = ids.map(val), mn = Math.min(...vs), mx = Math.max(...vs);
  ids.forEach((id, i) => { u[id] = mx > mn ? (vs[i] - mn) / (mx - mn) : 0; });
  return { ids: [...ids].sort((a, b) => u[a] - u[b]), u };
}
function setLookIds(ids) { const o = orderIds(ids, S.look.order || "rows"); S.look.ids = o.ids; S.look.u = o.u; }

// ---------- state ----------
const S = {
  lights: {}, ids: [], frame: {}, fpsCount: 0, fps: 0, ws: null,
  scene: [], engine: null, selection: new Set(), layout: {}, editLayout: false,
  targets: {},                                   // id -> channels we believe the roomtone holds
  look: LS.get("look", null) || { name: "none", params: {}, ids: [], order: "rows" },
  prevLook: null, tau: LS.get("tau", 150), fade: LS.get("fade", 800),
  presets: LS.get("presets", null) || new Array(8).fill(null),
  midimap: LS.get("midimap", {}), learn: null, mutedByUs: LS.get("mutedByUs", []),
  intensity: 1, showOthers: LS.get("showOthers", false),
  map: { groups: [], unnumbered: [] }, groupOf: {},
};
function plotted() { return S.showOthers ? S.ids : S.ids.filter((id) => S.lights[id].type === "br30"); }

// ---------- api ----------
function setStatus(msg, cls) { const el = $("status"); el.textContent = msg; el.className = "hint " + (cls || ""); }
function base() { return (S.base || $("srv").value).replace(/\/+$/, ""); }
// arclight.local often stops resolving on this network; tools/serve.py can find the Pi by MAC instead
async function resolveServer() {
  const typed = $("srv").value.replace(/\/+$/, "");
  if (!/arclight\.local/i.test(typed)) { S.base = typed; return; }
  try { const j = await (await fetch("api/resolve", { cache: "no-store" })).json(); if (j.ip) { S.base = typed.replace(/arclight\.local/i, j.ip); S.via = j.via; return; } } catch (e) {}
  S.base = typed; S.via = null;
}
async function api(method, path, body) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  let r;
  try {
    r = await fetch(base() + path, {
      method, headers: { Authorization: "Bearer " + $("tok").value, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body), signal: ctl.signal,
    });
  } catch (e) { throw new Error(e.name === "AbortError" ? "no answer in 8 s" : e.message); }
  finally { clearTimeout(timer); }
  if (r.status >= 400) { let m = "HTTP " + r.status; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
  return r.status === 204 ? null : r.json();
}

// ---------- write scheduler: one request in flight, targets coalesced at <= 10 Hz ----------
const Q = { pending: {}, inflight: false, timer: null, lastLat: 0, engineDirty: false, engineTimer: null };
function queueTargets(map) {
  for (const id in map) {
    Q.pending[id] = Object.assign(Q.pending[id] || {}, map[id]);
    S.targets[id] = Object.assign(S.targets[id] || {}, map[id]);
  }
  scheduleFlush();
}
function scheduleFlush() { if (Q.timer || Q.inflight) return; Q.timer = setTimeout(flush, 100); }
async function flush() {
  Q.timer = null;
  if (Q.inflight) return;
  const body = Q.pending; Q.pending = {};
  if (!Object.keys(body).length) { if (Q.engineDirty) uploadEngine(); updateHealth(); return; }
  Q.inflight = true; const t = performance.now();
  try { await api("PUT", "/v1/shader/0", { lights: body }); Q.lastLat = performance.now() - t; }
  catch (e) { setStatus("write failed: " + e.message, "bad"); }
  Q.inflight = false; updateHealth();
  if (Object.keys(Q.pending).length) scheduleFlush();
  else if (Q.engineDirty) uploadEngine();
}
function requestEngine() {
  LS.set("look", S.look); LS.set("tau", S.tau); LS.set("fade", S.fade);
  clearTimeout(Q.engineTimer);
  Q.engineTimer = setTimeout(() => { Q.engineDirty = true; if (!Q.inflight && !Q.timer) flush(); }, 300);
}

// ---------- engine layer (generated JS that runs on the Pi) ----------
function engineScript() {
  const smoothIds = S.ids.filter((id) => S.lights[id].type !== "relay");
  const old = S.prevLook || { name: "none", params: {}, ids: [] };
  return `${ENGINE_TAG}
// generated by arclight web/index.html -- edit the page, not this
var TAU = ${S.tau}, FADE = ${S.fade};
var SMOOTH_IDS = ${JSON.stringify(smoothIds)};
var OLD = ${JSON.stringify(old)};
var NEW = ${JSON.stringify(S.look)};
${LOOK_SRC}
var state = {}, lastT = 0, started = 0;
function idx(look) { var m = {}; for (var i = 0; i < look.ids.length; i++) m[look.ids[i]] = i; return m; }
var OLD_IDX = idx(OLD), NEW_IDX = idx(NEW);
function env(look, map, id, t) { var k = map[id]; if (k === undefined) return 1; var u = look.u && look.u[id] !== undefined ? look.u[id] : k / Math.max(1, look.ids.length - 1); return LOOKS[look.name](id, k, look.ids.length, t, look.params, u); }
function update(prev, curr, init) {
  if (!started) started = curr;
  var dt = lastT ? Math.min(200, curr - lastT) : 10; lastT = curr;
  var a = TAU > 0 ? 1 - Math.exp(-dt / TAU) : 1;
  var mix = FADE > 0 ? Math.min(1, (curr - started) / FADE) : 1;
  var byId = {};
  for (var i = 0; i < prev.lights.length; i++) byId[prev.lights[i].id] = prev.lights[i].channels;
  var out = [];
  for (var j = 0; j < SMOOTH_IDS.length; j++) {
    var id = SMOOTH_IDS[j], tgt = byId[id]; if (!tgt) continue;
    var st = state[id]; if (!st) { st = state[id] = {}; for (var c in tgt) st[c] = tgt[c]; }
    var e = mix >= 1 ? env(NEW, NEW_IDX, id, curr) : env(OLD, OLD_IDX, id, curr) * (1 - mix) + env(NEW, NEW_IDX, id, curr) * mix;
    var ch = {};
    for (var c2 in tgt) { st[c2] += (tgt[c2] - st[c2]) * a; var v = Math.round(st[c2] * e); ch[c2] = v < 0 ? 0 : (v > 255 ? 255 : v); }
    out.push({ id: id, channels: ch });
  }
  return { lights: out };
}`;
}
function findEngine(scene) { return scene.find((d) => d.id !== 0 && (d.script || "").startsWith(ENGINE_TAG)) || null; }
async function uploadEngine() {
  if (Q.inflight) { Q.engineDirty = true; return; }
  Q.engineDirty = false; Q.inflight = true; const t = performance.now();
  try {
    const script = engineScript();
    if (S.engine) await api("PUT", "/v1/shader/" + S.engine.id, { script });
    else S.engine = await api("POST", "/v1/scene/shader", { type: "js", script, position: "bottom" });
    S.prevLook = JSON.parse(JSON.stringify(S.look));

  if (drag.move) { if (drag.moved) { layoutUndo = drag.snap; saveLayout(); autosave(); reflowLook(); } else if (M.layer) identifyFix(drag.move); }
  else if (drag.box) {

// ---------- layout operations (pure: take a layout, return a new one) ----------
function alignLayout(L, ids, axis) { const m = ids.reduce((a, id) => a + L[id][axis], 0) / ids.length; const out = Object.assign({}, L); ids.forEach((id) => { out[id] = Object.assign({}, L[id], { [axis]: m }); }); return out; }

}
let layoutUndo = null;
function layoutOp(fn) {

}
function reflowLook() { if (S.look.ids.length && (S.look.name === "chase" || S.look.name === "wave")) { setLookIds(S.look.ids); requestEngine(); } }
function editSel(min) { const p = new Set(plotted()); const sel = [...S.selection].filter((id) => p.has(id)); if (sel.length < min) { setStatus(`select at least ${min} dots first`, "warn"); return null; } return sel; }
$("alignY").onclick = () => layoutOp(() => { const ids = editSel(2); return ids && alignLayout(S.layout, ids, "y"); });
$("alignX").onclick = () => layoutOp(() => { const ids = editSel(2); return ids && alignLayout(S.layout, ids, "x"); });

$("layoutUndoBtn").onclick = () => { if (!layoutUndo) { setStatus("nothing to undo", "warn"); return; } const cur = JSON.stringify(S.layout); S.layout = JSON.parse(layoutUndo); layoutUndo = cur; saveLayout(); autosave(); reflowLook(); needDraw = true; };

$("showOthers").onclick = () => { S.showOthers = !S.showOthers; LS.set("showOthers", S.showOthers); $("showOthers").classList.toggle("on", S.showOthers); document.body.classList.toggle("show-others", S.showOthers); needDraw = true; };
$("layoutMore").onclick = () => { $("layoutMenu").hidden = !$("layoutMenu").hidden; };
$("editLayout").onclick = () => { S.editLayout = !S.editLayout; $("editLayout").classList.toggle("on", S.editLayout); cv.classList.toggle("edit", S.editLayout); document.body.classList.toggle("editing", S.editLayout); needDraw = true; };

function updateSelInfo() {
  const sel = [...S.selection];
  $("selInfo").textContent = sel.length ? sel.length + " selected" : "";
  document.body.classList.toggle("relays-selected", sel.some((id) => S.lights[id] && S.lights[id].type === "relay"));

}

// ---------- colour of selection -> targets (roomtone) ----------
const colourSliders = {};
function renderColour() {
  const box = $("colour");
  const sel = [...S.selection].filter((id) => S.lights[id] && S.lights[id].type !== "relay");
  $("colInfo").textContent = sel.length ? `${sel.length} colour light(s)` : "select some bulbs";
  if (!box.children.length) {
    COLOUR_CHANS.concat(["intensity"]).forEach((c) => {
      const row = document.createElement("div"); row.className = "slider";
      const isI = c === "intensity";
      row.innerHTML = `<label>${c}</label><input type="range" min="0" max="${isI ? 100 : 255}" value="${isI ? 100 : 0}"><span class="v">${isI ? 100 : 0}</span><button class="learn" data-learn="col:${c}">midi</button>`;
      const inp = row.querySelector("input"), v = row.querySelector(".v");
      colourSliders[c] = inp;
      inp.addEventListener("input", () => { v.textContent = inp.value; if (isI) S.intensity = inp.value / 100; writeColour(); });
      box.appendChild(row);

    bindLearnButtons(box);
  }

    const t = S.targets[sel[0]] || {};

  }
}
function writeColour() {
  const map = {};

    const have = new Set(l.channels.map((c) => c.name)); map[id] = {};
    COLOUR_CHANS.forEach((c) => { if (have.has(c)) map[id][c] = Math.round(colourSliders[c].value * S.intensity); });
  }

}
function writeRelays(on) {
  const map = {};
  for (const id of S.selection) if (S.lights[id] && S.lights[id].type === "relay") map[id] = { brightness: on ? 255 : 0 };

}
$("relayOn").onclick = () => writeRelays(true);
$("relayOff").onclick = () => writeRelays(false);

// ---------- look UI ----------
function renderLook() {

  const os = $("order");

  os.value = S.look.order || "rows"; os.hidden = !(S.look.name === "chase" || S.look.name === "wave");

    const row = document.createElement("div"); row.className = "slider";
    const step = mx - mn <= 1 ? 0.01 : (mx - mn <= 30 ? 0.1 : 1);
    row.innerHTML = `<label>${k}</label><input type="range" min="${mn}" max="${mx}" step="${step}" value="${S.look.params[k]}"><span class="v">${S.look.params[k]}${unit}</span><button class="learn" data-learn="param:${k}">midi</button>`;
    const inp = row.querySelector("input"), v = row.querySelector(".v");

}
$("look").onchange = () => { S.look.name = $("look").value; S.look.params = defaultParams(S.look.name); setLookIds(S.look.ids.length ? S.look.ids : S.ids.filter((id) => S.lights[id].type === "br30")); renderLook(); requestEngine(); };
$("order").onchange = () => { S.look.order = $("order").value; setLookIds(S.look.ids); requestEngine(); };
$("applyLook").onclick = () => { const ids = [...S.selection].filter((id) => S.lights[id].type !== "relay"); if (!ids.length) { setStatus("select some bulbs first", "warn"); return; } setLookIds(ids); requestEngine(); setStatus(`look ${S.look.name} on ${ids.length} light(s)`, "ok"); };
$("lookAll").onclick = () => { setLookIds(S.ids.filter((id) => S.lights[id].type === "br30")); requestEngine(); };
$("fade").addEventListener("input", () => { S.fade = +$("fade").value; $("fadeV").textContent = S.fade; requestEngine(); });

// ---------- presets ----------
function renderPads() {
  const box = $("pads"); box.innerHTML = "";
  S.presets.forEach((p, i) => {
    const b = document.createElement("button"); b.textContent = (i + 1) + (p ? " " + (p.look.name) : " –"); if (p) b.className = "full";
    b.title = p ? `look ${p.look.name}, saved ${p.at}` : "empty";
    b.onclick = (ev) => { if (ev.shiftKey && ev.altKey) { arm("preset:" + i, b); return; } if (ev.altKey) { S.presets[i] = null; autosave(); } else if (ev.shiftKey) savePreset(i); else recallPreset(i); LS.set("presets", S.presets); renderPads(); };

}
async function savePreset(i) {
  try { const room = await api("GET", "/v1/shader/0"); S.presets[i] = { at: new Date().toLocaleString(), targets: room.template.lights, look: JSON.parse(JSON.stringify(S.look)), tau: S.tau, fade: S.fade }; LS.set("presets", S.presets); autosave(); renderPads(); setStatus("saved preset " + (i + 1), "ok"); }

}

  const map = {}; for (const k in p.targets) map[+k] = p.targets[k];
  queueTargets(map);
  S.look = JSON.parse(JSON.stringify(p.look)); S.tau = p.tau; S.fade = p.fade; renderLook(); requestEngine(); renderColour();

}

// ---------- MIDI ----------
function arm(target, btnEl) {
  document.querySelectorAll(".learn.armed").forEach((b) => b.classList.remove("armed"));
  if (S.learn === target) { S.learn = null; return; }
  S.learn = target; if (btnEl) btnEl.classList.add("armed"); setStatus("move a knob or hit a pad to bind " + target, "warn");
}
function bindLearnButtons(root) {
  root.querySelectorAll(".learn").forEach((b) => {
    b.onclick = (ev) => { ev.stopPropagation(); ev.preventDefault(); arm(b.dataset.learn, b); };
    markBound(b);
  });
}
function markBound(b) {

}
const noteState = {};
function onMidi(ev) {

  else if (type === 0x90 && d2 > 0) { key = `note:${ch}:${d1}`; val = 1; isTrigger = true; }
  else if (type === 0x80 || (type === 0x90 && d2 === 0)) { return; }
  else return;

  else if (kind === "fade") setRange($("fade"), val);
  else if (kind === "tau") setRange($("tau"), val);
  else if (kind === "look") { const names = Object.keys(LOOK_PARAMS); const n = trig && val === 1 ? names[(names.indexOf(S.look.name) + 1) % names.length] : names[Math.min(names.length - 1, Math.floor(val * names.length))]; if (n !== S.look.name) { $("look").value = n; $("look").onchange(); } }

$("midiEnable").onclick = enableMidi;
$("clearMidi").onclick = () => { S.midimap = {}; LS.set("midimap", {}); autosave(); document.querySelectorAll(".learn").forEach(markBound); };

// ---------- room buttons (two-click confirm for destructive ones) ----------
function twoClick(el, fn) { let armed = null; el.onclick = () => { if (armed) { clearTimeout(armed); armed = null; el.classList.remove("confirm"); fn(); } else { el.classList.add("confirm"); armed = setTimeout(() => { armed = null; el.classList.remove("confirm"); }, 3000); } }; }
async function toggleSolo() {
  if (S.soloBusy) return; S.soloBusy = true; renderSolo();
  try { if (S.mutedByUs.length) await releaseRoom(); else await ownRoom(); }
  finally { S.soloBusy = false; renderSolo(); }
}
function renderSolo() {
  const others = foreignLayers().length, held = S.mutedByUs.length > 0;
  $("solo").classList.toggle("on", held); $("solo").disabled = S.soloBusy || (!others && !held);
  $("solo").title = held ? "Click to unmute the other layers" : others ? `Mute the ${others} other layer(s) so only yours show` : "No other layers are running";
}
$("solo").onclick = toggleSolo;
twoClick($("blackout"), blackout);
twoClick($("resetScene"), resetScene);

// ---------- identify / mapping sequence: its own layer on top, never touches the roomtone ----------
const ID_TAG = "// arclight-identify v1";
const M = { layer: null, fixed: null, period: LS.get("idPeriod", 500), ids: [], timer: null, lastLit: null };
function identifyScript() {
  const ch = {}; M.ids.forEach((id) => { ch[id] = S.lights[id].channels.map((c) => c.name); });
  return `${ID_TAG}
// generated by arclight web/index.html: lights one of IDS at a time (white) so the dots can be mapped
var IDS = ${JSON.stringify(M.ids)}, PERIOD = ${M.period}, FIXED = ${M.fixed === null ? "null" : M.fixed};
var CH = ${JSON.stringify(ch)};
function update(prev, curr, init) {
  var on = FIXED !== null ? FIXED : IDS[Math.floor(curr / PERIOD) % IDS.length];
  var out = [];
  for (var i = 0; i < IDS.length; i++) {
    var id = IDS[i], chans = CH[id], c = {};
    var hasWhite = chans.indexOf("cold") >= 0 || chans.indexOf("warm") >= 0 || chans.indexOf("brightness") >= 0;
    for (var j = 0; j < chans.length; j++) { var n = chans[j]; c[n] = (id === on && (!hasWhite || n === "cold" || n === "warm" || n === "brightness")) ? 255 : 0; }
    out.push({ id: id, channels: c });
  }
  return { lights: out };
}`;
}
function findIdentify(scene) { return scene.filter((d) => d.id !== 0 && (d.script || "").startsWith(ID_TAG)); }
async function identifyUpload() {
  const script = identifyScript();
  try {
    if (M.layer) await api("PUT", "/v1/shader/" + M.layer.id, { script });
    else M.layer = await api("POST", "/v1/scene/shader", { type: "js", script, position: "bottom" });
  } catch (e) { setStatus("identify failed: " + e.message, "bad"); }
  renderIdentify(); refreshScene();
}
function identifyStart() {
  if (!S.ids.length) { setStatus("connect first", "warn"); return; }
  const sel = [...S.selection].sort((a, b) => a - b);
  M.ids = sel.length ? sel : S.ids.filter((id) => S.lights[id].type === "br30");
  M.fixed = null; identifyUpload();
  setStatus(`identify: stepping through ${M.ids.length} light(s), ${M.period} ms each`, "ok");
}
async function identifyStop() {
  const layers = findIdentify(S.scene); if (M.layer && !layers.find((d) => d.id === M.layer.id)) layers.push(M.layer);
  for (const d of layers) { try { await api("DELETE", "/v1/shader/" + d.id); } catch (e) {} }
  M.layer = null; M.fixed = null; M.lastLit = null; $("idNow").textContent = ""; renderIdentify(); refreshScene(); needDraw = true;
}
function litId() { let best = null, bs = 0; for (const id of M.ids) { const f = S.frame[id] || {}; let sum = 0; for (const k in f) sum += f[k]; if (sum > bs) { bs = sum; best = id; } } return best; }
function identifyFix(id) { if (!M.layer) return; M.fixed = id; $("idNow").textContent = `now: #${id} (held)`; identifyUpload(); }
function identifyStep(dir) { if (!M.layer) return; const cur = M.fixed !== null ? M.fixed : litId(); let i = M.ids.indexOf(cur); i = (i + dir + M.ids.length) % M.ids.length; identifyFix(M.ids[i]); }
function identifyPause() { if (!M.layer) return; if (M.fixed !== null) { M.fixed = null; identifyUpload(); } else identifyFix(litId() || M.ids[0]); }
function renderIdentify() {
  const on = !!M.layer;
  $("idStart").classList.toggle("on", on); $("idStart").textContent = on ? "Restart" : "Start";
  $("idPause").textContent = M.fixed !== null ? "Resume" : "Pause";
  ["idPause", "idPrev", "idNext", "idStop"].forEach((i) => { $(i).disabled = !on; });
  $("idSpeed").value = M.period; $("idSpeedV").textContent = M.period;
}
$("idStart").onclick = identifyStart;
$("idStop").onclick = identifyStop;
$("idPause").onclick = identifyPause;
$("idPrev").onclick = () => identifyStep(-1);
$("idNext").onclick = () => identifyStep(1);
$("idSpeed").addEventListener("input", () => { M.period = +$("idSpeed").value; $("idSpeedV").textContent = M.period; LS.set("idPeriod", M.period); if (M.layer) { clearTimeout(M.timer); M.timer = setTimeout(identifyUpload, 300); } });
window.addEventListener("keydown", (ev) => {
  if (!M.layer || /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
  if (ev.key === "ArrowRight") { identifyStep(1); ev.preventDefault(); }
  else if (ev.key === "ArrowLeft") { identifyStep(-1); ev.preventDefault(); }
  else if (ev.key === " ") { identifyPause(); ev.preventDefault(); }
});

// ---------- saving into the repo (web/data/*.json via tools/serve.py) ----------
async function saveData(name, obj) { try { const r = await fetch("data/" + name + ".json", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(obj) }); return r.ok; } catch (e) { return false; } }
async function loadData(name) { try { const r = await fetch("data/" + name + ".json", { cache: "no-store" }); return r.ok ? await r.json() : null; } catch (e) { return null; } }
let saveTimer = null;
function autosave() { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveAll(false), 800); }
async function saveAll(loud) {
  const ok = (await saveData("layout", Object.assign({ _frame: FP.ID }, S.layout))) && (await saveData("presets", S.presets)) && (await saveData("midimap", S.midimap));
  if (loud || !ok) setStatus(ok ? "saved to web/data/" : "not saved: run tools/serve.py (or use ⋯ export)", ok ? "ok" : "warn");
}
$("saveAll").onclick = () => saveAll(true);

// ---------- misc ----------
function btn(label, fn) { const b = document.createElement("button"); b.textContent = label; b.onclick = (ev) => { ev.stopPropagation(); fn().catch((e) => setStatus(e.message, "bad")); }; return b; }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function download(name, obj) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" })); a.download = name; a.click(); }
function pickFile(cb) { const f = $("filePick"); f.onchange = () => { const r = new FileReader(); r.onload = () => { try { cb(JSON.parse(r.result)); } catch (e) { setStatus("bad json", "bad"); } }; r.readAsText(f.files[0]); f.value = ""; }; f.click(); }

// ---------- init ----------
(function init() {
  const q = new URLSearchParams(location.search);
  $("srv").value = q.get("server") || LS.get("srv", null) || "http://arclight.local:8080";
  $("tok").value = q.get("token") || LS.get("tok", "");
  $("connect").onclick = connect;
  resize(); renderLook(); renderPads(); renderColour(); renderIdentify(); renderSolo(); $("showOthers").classList.toggle("on", S.showOthers); document.body.classList.toggle("show-others", S.showOthers);
  bindLearnButtons(document.querySelector("aside"));
  if ($("tok").value) connect();
})();
</script>
